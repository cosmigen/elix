<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Test App</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      background: var(--bg-secondary);
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .titlebar-controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-close { background: #ef4444; }
    .btn-min { background: #eab308; }
    .btn-max { background: #22c55e; }

    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .log-container {
      flex: 1;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      overflow-y: auto;
      min-height: 140px;
    }

    .log-entry {
      margin-bottom: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">
      <span>🧪</span>
      <span>Fake Test App</span>
    </div>
    <div class="titlebar-controls">
      <button class="control-btn btn-min" title="Minimize" onclick="if(window.elix?.window?.minimize) { window.elix.window.minimize(); }"></button>
      <button class="control-btn btn-max" title="Maximize" onclick="if(window.elix?.window?.maximize) { window.elix.window.maximize(); }"></button>
      <button class="control-btn btn-close" title="Close" onclick="if(window.elix?.window?.close) { window.elix.window.close(); } else { window.close(); }"></button>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>App Bridge Connected</span>
      </div>
      <p style="font-size: 13px; color: var(--text-muted);">
        Listening for AI tool calls. Capability: <code>ping(message?)</code>
      </p>
    </div>

    <div style="font-size: 12px; font-weight: 600; color: var(--text-muted);">IPC ACTIVITY LOG</div>
    <div class="log-container" id="logContainer">
      <div class="log-entry">[SYSTEM] Fake Test App initialized.</div>
    </div>
  </div>

  <script>
    const logContainer = document.getElementById('logContainer');
    const APP_ID = 'com.elix.fakeapp';

    function log(msg) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function flashVisualEffect() {
      const card = document.querySelector('.card');
      if (card) {
        card.style.transition = 'background 0.2s, box-shadow 0.2s';
        card.style.background = '#1e3a8a';
        card.style.boxShadow = '0 0 16px #3b82f6';
        setTimeout(() => {
          card.style.background = 'var(--bg-secondary)';
          card.style.boxShadow = 'none';
        }, 500);
      }
    }

    async function handleCapability(capability, rawArgs) {
      flashVisualEffect();
      const args = rawArgs?.data || rawArgs?.args || rawArgs?.payload || rawArgs || {};
      log(`⚡ Live Capability Invoked: '${capability}' with args: ${JSON.stringify(args)}`);
      
      if (capability === 'ping' || capability === 'CALL_TOOL') {
        const msg = args?.message || 'pong';
        const response = {
          success: true,
          reply: 'pong',
          message: msg,
          timestamp: Date.now(),
          appId: APP_ID,
          status: 'ok',
        };
        log(`✓ Replied with pong: ${JSON.stringify(response)}`);
        return response;
      }

      if (capability === 'echo_test') {
        const text = args?.text || args?.message || 'echo';
        const response = {
          success: true,
          echo: text,
          received: args,
          timestamp: Date.now(),
          appId: APP_ID,
          status: 'ok',
        };
        log(`✓ Replied with echo: ${JSON.stringify(response)}`);
        return response;
      }

      return {
        success: true,
        status: 'ok',
        appId: APP_ID,
        capability,
        data: args,
        timestamp: new Date().toISOString(),
      };
    }

    // Connect to Local WebSocket IPC Bridge
    function connectLocalIpc() {
      try {
        const ws = new WebSocket(`ws://localhost:7391?appId=${APP_ID}`);

        ws.onopen = () => {
          log('🟢 Connected to Local ELIX WebSocket IPC Bridge');
          ws.send(JSON.stringify({ type: 'REGISTER', appId: APP_ID }));
        };

        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.action === 'CLOSE' || data.type === 'WINDOW_CLOSE') {
              log('🔴 Received CLOSE command from host. Closing window...');
              setTimeout(() => window.close(), 100);
              return;
            }

            const capability = data.capability || data.payload?.capability || data.action || (data.type === 'TOOL_INVOKED' || data.type === 'TOOL_INVOKE' ? (data.capability || data.payload?.capability || 'ping') : data.type);
            const args = data.payload?.args !== undefined ? data.payload.args : (data.payload || data.args || data.data || {});

            if (capability && capability !== 'REGISTER_ACK') {
              const result = await handleCapability(capability, args);
              if (data.id) {
                ws.send(JSON.stringify({
                  type: 'TOOL_RESULT',
                  id: data.id,
                  appId: APP_ID,
                  payload: {
                    success: true,
                    result,
                  }
                }));
              }
            }
          } catch (e) {
            console.error(e);
          }
        };

        ws.onclose = () => {
          setTimeout(connectLocalIpc, 1500);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (err) {
        setTimeout(connectLocalIpc, 1500);
      }
    }

    // Register capability handler when window.elix bridge is ready
    function setupBridge() {
      if (window.elix && typeof window.elix.handle === 'function') {
        window.elix.handle('ping', async (payload) => handleCapability('ping', payload));
        window.elix.handle('echo_test', async (payload) => handleCapability('echo_test', payload));
        log('Capabilities registered with in-process bridge.');
      } else {
        setTimeout(setupBridge, 50);
      }
    }

    setupBridge();
    connectLocalIpc();
  </script>
</body>
</html>
