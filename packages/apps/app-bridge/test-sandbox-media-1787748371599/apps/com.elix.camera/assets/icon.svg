<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cam-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>
    <linearGradient id="cam-lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00a2ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="cam-glass-glint" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#cam-bg-grad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
  <!-- Camera Body -->
  <path d="M12 16 L16 12 H32 L36 16 H39 C40.6 16 42 17.4 42 19 V35 C42 36.6 40.6 38 39 38 H9 C7.4 38 6 36.6 6 35 V19 C6 17.4 7.4 16 9 16 Z" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <!-- Lens Outer Rim -->
  <circle cx="24" cy="27" r="10" fill="#0f172a" stroke="url(#cam-lens-grad)" stroke-width="2.5" />
  <!-- Lens Core Glass -->
  <circle cx="24" cy="27" r="7" fill="url(#cam-glass-glint)" />
  <!-- Red Recording Indicator Dot -->
  <circle cx="37" cy="20" r="2" fill="#ef4444" />
