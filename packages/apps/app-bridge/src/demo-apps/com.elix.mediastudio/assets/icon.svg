<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradWand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#gradStudio)" />
  <rect x="12" y="12" width="40" height="40" rx="10" fill="#090d16" />
  
  <!-- Studio Canvas & Crop Frame -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" />
  
  <!-- Crop Corner Handles -->
  <rect x="16" y="16" width="6" height="6" fill="#00a2ff" rx="1" />
  <rect x="42" y="16" width="6" height="6" fill="#00a2ff" rx="1" />
  <rect x="16" y="42" width="6" height="6" fill="#00a2ff" rx="1" />
  <rect x="42" y="42" width="6" height="6" fill="#00a2ff" rx="1" />

  <!-- Magic Sparkle / Studio Wand -->
  <polygon points="32,24 34,29 39,31 34,33 32,38 30,33 25,31 30,29" fill="url(#gradWand)" />
</svg>
