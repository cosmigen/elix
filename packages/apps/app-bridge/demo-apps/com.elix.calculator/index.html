<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * ws://127.0.0.1:* ws://localhost:*;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIX Calculator</title>
  <style>
    :root {
      --bg: #181825;
      --surface: #1e1e2e;
      --panel: #11111b;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #fab387;
      --accent-active: #f9e2af;
      --operator: #cba6f7;
      --equals: #a6e3a1;
      --danger: #f38ba8;
      --border: #313244;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0,0,0,0.65);
    }

    /* Titlebar */
    .titlebar {
      height: 36px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      app-region: drag;
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .liquid-capsule {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 4px;
      background: linear-gradient(180deg, #182844 0%, #101c33 100%);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 -1px 1px rgba(255, 255, 255, 0.04), 0 2px 6px rgba(0, 0, 0, 0.35);
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .liquid-divider {
      width: 1px;
      height: 16px;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.07) 30%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
    }

    .liquid-btn {
      position: relative;
      width: 32px;
      height: 28px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      padding: 0;
    }

    .liquid-glyph {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55));
      transition: filter 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .liquid-btn:hover .liquid-glyph {
      transform: scale(1.08);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.65)) drop-shadow(0 0 10px rgba(186, 215, 255, 0.45));
    }

    .liquid-btn.btn-close:hover .liquid-glyph {
      transform: scale(1.08) rotate(4deg);
      filter: drop-shadow(0 0 4px rgba(255, 120, 140, 0.75)) drop-shadow(0 0 10px rgba(244, 63, 94, 0.45));
    }

    .liquid-btn:active .liquid-glyph {
      transform: scale(0.92);
    }

    /* LCD Screen Display */
    .lcd-display {
      background: var(--panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      height: 100px;
      border-bottom: 1px solid var(--border);
    }

    .lcd-expression {
      font-size: 13px;
      color: var(--subtext);
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .lcd-result {
      font-size: 32px;
      font-weight: bold;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    /* Keypad Grid */
    .keypad {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px;
      background: var(--bg);
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:hover {
      background: #313244;
    }

    .btn-op {
      color: var(--operator);
      background: #1e1e2e;
    }

    .btn-clear {
      color: var(--danger);
    }

    .btn-equals {
      background: var(--equals);
      color: #11111b;
      font-weight: bold;
    }
    .btn-equals:hover {
      background: #94e2d5;
    }

    /* History Ledger Drawer */
    .ledger-drawer {
      height: 120px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .ledger-header {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      color: var(--subtext);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .ledger-items {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .ledger-row {
      display: flex;
      justify-content: space-between;
      color: var(--subtext);
      cursor: pointer;
    }
    .ledger-row:hover {
      color: var(--text);
    }
    .ledger-val {
      font-weight: bold;
      color: var(--accent);
    }
  
    /* Brushed Liquid Metal Window Control Capsule */
    .liquid-metal-capsule {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(180deg, #2a3346 0%, #151b28 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      padding: 3px 6px;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .control-btn {
      width: 26px;
      height: 22px;
      border: none;
      background: transparent;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.15s ease;
    }
    .control-btn svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }
    .control-btn.btn-close:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

      /* ELIX OS Universal Window Framing & Liquid Metal Capsule Controls */
    .window-controls-capsule, .liquid-metal-capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 100%), #141a29;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 14px rgba(0, 0, 0, 0.45);
      border-radius: 9999px;
      -webkit-app-region: no-drag;
      z-index: 9999;
    }

    .window-controls-capsule button, .window-controls-capsule .control-btn,
    .liquid-metal-capsule button, .liquid-metal-capsule .control-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    .window-controls-capsule button svg, .window-controls-capsule .control-btn svg,
    .liquid-metal-capsule button svg, .liquid-metal-capsule .control-btn svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }

    .window-controls-capsule button:hover, .window-controls-capsule .control-btn:hover,
    .liquid-metal-capsule button:hover, .liquid-metal-capsule .control-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .window-controls-capsule button.btn-close:hover, .window-controls-capsule .control-btn.btn-close:hover,
    .liquid-metal-capsule button.btn-close:hover, .liquid-metal-capsule .control-btn.btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>
  <!-- Titlebar -->
  <div class="titlebar" data-elix-drag>
    <div class="titlebar-brand">
      <span>🔢</span>
      <span>ELIX Calculator</span>
    </div>
    
    <div class="liquid-capsule">
      <svg width="0" height="0" style="position: absolute;">
        <defs>
          <linearGradient id="liquid-chrome-grad-calc" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#e2e8f0" />
            <stop offset="50%" stop-color="#94a3b8" />
            <stop offset="75%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
        </defs>
      </svg>

      <button class="liquid-btn" id="btn-minimize" title="Minimize">
        <svg class="liquid-glyph" viewBox="0 0 32 32">
          <path d="M7 16 C7 14.3, 8.3 13, 10 13 L22 13 C23.7 13, 25 14.3, 25 16 C25 17.7, 23.7 19, 22 19 L10 19 C8.3 19, 7 17.7, 7 16 Z" fill="url(#liquid-chrome-grad-calc)" />
          <path d="M10 14.5 L22 14.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8" />
        </svg>
      </button>

      <div class="liquid-divider"></div>

      <button class="liquid-btn" id="btn-maximize" title="Maximize / Restore">
        <svg class="liquid-glyph" viewBox="0 0 32 32">
          <path d="M16 7 C18 7, 23 9.5, 23 11 C23 12.5, 18 15, 16 15 C14 15, 9 12.5, 9 11 C9 9.5, 14 7, 16 7 Z" fill="url(#liquid-chrome-grad-calc)" />
          <path d="M14 8.5 C16 8.5, 21 10.2, 21 11" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.8" fill="none" />
          <path d="M9 14.5 C11 16, 14 17.5, 16 17.5 C18 17.5, 21 16, 23 14.5" stroke="url(#liquid-chrome-grad-calc)" stroke-width="2.6" stroke-linecap="round" fill="none" />
          <path d="M9 19 C11 20.5, 14 22, 16 22 C18 22, 21 20.5, 23 19" stroke="url(#liquid-chrome-grad-calc)" stroke-width="2.6" stroke-linecap="round" fill="none" />
        </svg>
      </button>

      <div class="liquid-divider"></div>

      <button class="liquid-btn btn-close" id="btn-close" title="Close">
        <svg class="liquid-glyph" viewBox="0 0 32 32">
          <path d="M11 9 C9.5 9, 8.5 10.5, 9.5 12 C10.8 13.5, 13.5 16, 13.5 16 C13.5 16, 10.8 18.5, 9.5 20 C8.5 21.5, 9.5 23, 11 23 C12.5 23, 14.5 20.8, 16 19 C17.5 20.8, 19.5 23, 21 23 C22.5 23, 23.5 21.5, 22.5 20 C21.2 18.5, 18.5 16, 18.5 16 C18.5 16, 21.2 13.5, 22.5 12 C23.5 10.5, 22.5 9, 21 9 C19.5 9, 17.5 11.2, 16 13 C14.5 11.2, 12.5 9, 11 9 Z" fill="url(#liquid-chrome-grad-calc)" />
          <circle cx="11.5" cy="11.5" r="0.8" fill="#ffffff" opacity="0.9" />
          <circle cx="20.5" cy="11.5" r="0.8" fill="#ffffff" opacity="0.9" />
        </svg>
      </button>
    </div>
  </div>

  <!-- LCD Screen -->
  <div class="lcd-display">
    <div class="lcd-expression" id="lcd-expr">0</div>
    <div class="lcd-result display" id="lcd-main" data-id="calc-display">0</div>
  </div>

  <!-- Keypad -->
  <div class="keypad" data-elix-no-drag>
    <button class="btn btn-clear" data-action="clear">C</button>
    <button class="btn btn-op" data-action="paren">(</button>
    <button class="btn btn-op" data-action="paren">)</button>
    <button class="btn btn-op" data-action="op" data-val="/">÷</button>

    <button class="btn" data-val="7">7</button>
    <button class="btn" data-val="8">8</button>
    <button class="btn" data-val="9">9</button>
    <button class="btn btn-op" data-action="op" data-val="*">×</button>

    <button class="btn" data-val="4">4</button>
    <button class="btn" data-val="5">5</button>
    <button class="btn" data-val="6">6</button>
    <button class="btn btn-op" data-action="op" data-val="-">−</button>

    <button class="btn" data-val="1">1</button>
    <button class="btn" data-val="2">2</button>
    <button class="btn" data-val="3">3</button>
    <button class="btn btn-op" data-action="op" data-val="+">+</button>

    <button class="btn" data-val="0">0</button>
    <button class="btn" data-val=".">.</button>
    <button class="btn btn-clear" data-action="backspace">⌫</button>
    <button class="btn btn-equals" data-action="eval">=</button>
  </div>

  <!-- History Ledger -->
  <div class="ledger-drawer">
    <div class="ledger-header">
      <span>Calculation Ledger</span>
      <span id="ledger-count">0 items</span>
    </div>
    <div class="ledger-items history-list" id="ledger-list" data-id="calc-history"></div>
  </div>

  <script>
    const { ipcRenderer } = window.require ? window.require('electron') : (typeof require !== 'undefined' ? require('electron') : { ipcRenderer: { send: () => {} } });
    document.getElementById('btn-minimize')?.addEventListener('click', () => {
      if (typeof ipcRenderer !== 'undefined' && ipcRenderer && ipcRenderer.send) {
        ipcRenderer.send('app-window-minimize');
      }
    });
    document.getElementById('btn-maximize')?.addEventListener('click', () => {
      if (typeof ipcRenderer !== 'undefined' && ipcRenderer && ipcRenderer.send) {
        ipcRenderer.send('app-window-maximize');
      }
    });
    document.getElementById('btn-close')?.addEventListener('click', () => {
      if (typeof ipcRenderer !== 'undefined' && ipcRenderer && ipcRenderer.send) {
        ipcRenderer.send('app-window-close');
      } else {
        window.close();
      }
    });

    let currentInput = '0';
    let expressionHistory = '';
    const historyLedger = [];

    const lcdExpr = document.getElementById('lcd-expr');
    const lcdMain = document.getElementById('lcd-main');
    const ledgerList = document.getElementById('ledger-list');
    const ledgerCount = document.getElementById('ledger-count');

    function updateDisplay() {
      lcdExpr.textContent = expressionHistory || '0';
      lcdMain.textContent = currentInput || '0';
    }

    function addLedgerEntry(expr, res) {
      historyLedger.unshift({ expr, res, time: Date.now() });
      if (historyLedger.length > 20) historyLedger.pop();
      renderLedger();
    }

    function renderLedger() {
      ledgerList.innerHTML = '';
      historyLedger.forEach(item => {
        const div = document.createElement('div');
        div.className = 'ledger-row';
        div.innerHTML = `<span>${item.expr}</span><span class="ledger-val">= ${item.res}</span>`;
        div.addEventListener('click', () => {
          currentInput = String(item.res);
          expressionHistory = item.expr;
          updateDisplay();
        });
        ledgerList.appendChild(div);
      });
      ledgerCount.textContent = `${historyLedger.length} items`;
    }

    function evaluateMath(exprStr) {
      // Safe arithmetic evaluator
      const sanitized = exprStr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/[^0-9+\-*/().\s]/g, '');

      if (!sanitized.trim()) return 0;

      // Evaluation using Function constructor with sanitized math tokens
      const fn = new Function(`'use strict'; return (${sanitized});`);
      const val = fn();
      if (typeof val !== 'number' || !Number.isFinite(val)) {
        throw new Error('Arithmetic error / division by zero');
      }
      return Math.round(val * 1e8) / 1e8;
    }

    // Keypad Click Handlers
    document.querySelectorAll('.keypad button').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-val');
        const action = btn.getAttribute('data-action');

        if (val) {
          if (currentInput === '0' && val !== '.') {
            currentInput = val;
          } else {
            currentInput += val;
          }
        } else if (action === 'clear') {
          currentInput = '0';
          expressionHistory = '';
        } else if (action === 'backspace') {
          currentInput = currentInput.slice(0, -1) || '0';
        } else if (action === 'paren') {
          if (currentInput === '0') currentInput = btn.textContent;
          else currentInput += btn.textContent;
        } else if (action === 'eval') {
          try {
            const fullExpr = expressionHistory ? `${expressionHistory} ${currentInput}` : currentInput;
            const res = evaluateMath(fullExpr);
            addLedgerEntry(fullExpr, res);
            expressionHistory = `${fullExpr} =`;
            currentInput = String(res);
          } catch (e) {
            currentInput = 'Error';
          }
        }
        updateDisplay();
      });
    });

    // Window Controls Fallback for Web/Browser Container
    if (window.elix && window.elix.window) {
      document.getElementById('btn-minimize')?.addEventListener('click', () => window.elix.window.minimize());
      document.getElementById('btn-maximize')?.addEventListener('click', () => window.elix.window.maximize());
      document.getElementById('btn-close')?.addEventListener('click', () => window.elix.window.close());
    }

    // ==========================================
    // Dynamic Tool Capability Handlers (AI Bridge)
    // ==========================================
    const APP_ID = 'com.elix.calculator';

    function flashLcdEffect() {
      const lcd = document.querySelector('.lcd-display');
      if (lcd) {
        lcd.style.transition = 'background 0.2s, box-shadow 0.2s';
        lcd.style.background = '#28283d';
        lcd.style.boxShadow = 'inset 0 0 18px #fab387';
        setTimeout(() => {
          lcd.style.background = 'var(--panel)';
          lcd.style.boxShadow = 'none';
        }, 500);
      }
    }

    async function handleCapability(capability, rawArgs) {
      flashLcdEffect();
      const args = rawArgs?.data || rawArgs?.args || rawArgs?.payload || rawArgs || {};

      if (capability === 'calculate' || capability === 'CALL_TOOL') {
        const expr = args.expression || args.expr || (typeof args === 'string' ? args : '0');
        if (!expr || expr === '0') {
          throw new Error("Missing 'expression' argument");
        }

        const result = evaluateMath(expr);
        expressionHistory = `${expr} =`;
        currentInput = String(result);
        updateDisplay();
        addLedgerEntry(expr, result);

        return {
          success: true,
          expression: expr,
          result: result,
          timestamp: Date.now()
        };
      }

      if (capability === 'get_history') {
        return {
          success: true,
          count: historyLedger.length,
          history: [...historyLedger]
        };
      }

      if (capability === 'clear_history') {
        historyLedger.length = 0;
        currentInput = '0';
        expressionHistory = '';
        renderLedger();
        updateDisplay();
        return {
          success: true,
          message: 'Calculation ledger cleared',
          count: 0
        };
      }

      if (capability === 'get_last_result') {
        const last = historyLedger[0];
        return {
          success: true,
          lastExpression: last ? last.expr : null,
          lastResult: last ? last.res : (Number(currentInput) || 0),
          ledgerCount: historyLedger.length
        };
      }

      return { status: 'ok', appId: APP_ID, capability, data: args };
    }

    // Connect to Local WebSocket IPC Bridge
    function connectWs() {
      try {
        const ws = new WebSocket(`ws://127.0.0.1:7391?appId=${APP_ID}`);

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: 'REGISTER', appId: APP_ID }));
        };

        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.action === 'CLOSE' || data.type === 'WINDOW_CLOSE') {
              setTimeout(() => window.close(), 100);
              return;
            }

            // Filter out events explicitly targeting other apps
            if (data.appId && data.appId !== APP_ID && data.appId !== 'unknown' && !data.appId.includes('calculator')) {
              return;
            }

            const toolName = (data.tool || data.capability || data.payload?.capability || data.action || '').toLowerCase();
            const payload = data.args || data.payload?.args || data.payload || data.data || {};
            const resObj = data.result || data;

            // 1. calculate
            if (toolName.includes('calculate') || data.action === 'calculate' || payload.expression || payload.expr) {
              const expr = payload.expression || payload.expr || (typeof payload === 'string' ? payload : '') || resObj.expression || resObj.data?.expression || '';
              let res = resObj.result !== undefined ? (resObj.result.result !== undefined ? resObj.result.result : resObj.result) : (resObj.data?.result !== undefined ? resObj.data.result : undefined);
              
              if (res === undefined && expr) {
                try {
                  res = evaluateMath(expr);
                } catch {
                  res = 'Error';
                }
              }

              if (res !== undefined) {
                currentInput = String(res);
                expressionHistory = expr ? `${expr} =` : '';
                updateDisplay();
                if (expr) {
                  addLedgerEntry(expr, res);
                }
                flashLcdEffect();
              }
            }

            // 2. clear_history
            else if (toolName.includes('clear_history') || data.action === 'clear_history') {
              historyLedger.length = 0;
              currentInput = '0';
              expressionHistory = '';
              renderLedger();
              updateDisplay();
              flashLcdEffect();
            }

            // 3. get_history / get_last_result
            else if (toolName.includes('get_history') || toolName.includes('get_last_result') || data.action === 'get_history' || data.action === 'get_last_result') {
              flashLcdEffect();
              if (historyLedger.length > 0) {
                const last = historyLedger[0];
                currentInput = String(last.res);
                expressionHistory = `${last.expr} =`;
                updateDisplay();
              }
            }

            // 4. RPC Tool Invoke handler
            else if (data.type === 'TOOL_INVOKE' && data.id) {
              const capability = data.payload?.capability || toolName || 'calculate';
              const result = await handleCapability(capability, payload);
              ws.send(JSON.stringify({
                type: 'TOOL_RESULT',
                id: data.id,
                appId: APP_ID,
                payload: {
                  success: true,
                  result,
                }
              }));
            }
          } catch (e) {
            console.error('Calculator IPC Error:', e);
          }

  <script>
    // ELIX OS Universal Window Control Binding & Declarative Tab Routing
    (function initWindowControlBindings() {
      let ipc = null;
      try {
        if (typeof window !== "undefined" && window.require) {
          ipc = window.require("electron").ipcRenderer;
        } else if (window.electron && window.electron.ipcRenderer) {
          ipc = window.electron.ipcRenderer;
        }
      } catch (e) {}

      const sendAction = function(action) {
        if (ipc) {
          ipc.send("window-" + action);
          ipc.send("elix:window:" + action);
          ipc.send("app-window-" + action);
        } else if (typeof ws !== "undefined" && ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "window_action", action: "window-" + action }));
        } else if (window.__ELIX_WS__ && window.__ELIX_WS__.readyState === 1) {
          window.__ELIX_WS__.send(JSON.stringify({ type: "window_action", action: "window-" + action }));
        }
      };

      function bindControls() {
        document.getElementById("win-min")?.addEventListener("click", () => sendAction("minimize"));
        document.getElementById("win-max")?.addEventListener("click", () => sendAction("maximize"));
        document.getElementById("win-close")?.addEventListener("click", () => sendAction("close"));
        document.getElementById("btn-minimize")?.addEventListener("click", () => sendAction("minimize"));
        document.getElementById("btn-maximize")?.addEventListener("click", () => sendAction("maximize"));
        document.getElementById("btn-close")?.addEventListener("click", () => sendAction("close"));
        document.getElementById("btnMin")?.addEventListener("click", () => sendAction("minimize"));
        document.getElementById("btnMax")?.addEventListener("click", () => sendAction("maximize"));
        document.getElementById("btnClose")?.addEventListener("click", () => sendAction("close"));

        // Declarative tab routing
        const navButtons = document.querySelectorAll("[data-tab], [data-target], [data-view], .nav-item, .tab-btn");
        navButtons.forEach(btn => {
          if (btn.__elix_tab_bound) return;
          btn.__elix_tab_bound = true;
          btn.addEventListener("click", (e) => {
            const targetId = btn.getAttribute("data-tab") || btn.getAttribute("data-target") || btn.getAttribute("data-view") || btn.getAttribute("href")?.replace(/^#/, "");
            if (!targetId) return;
            const container = btn.closest("nav, .sidebar, .tab-bar, .sub-nav, .activity-rail, .nav-tabs, .tabs") || btn.parentElement || document;
            container.querySelectorAll(".nav-item, .tab-btn, button, a").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            const parentViewScope = btn.closest(".app-container, .main-container, .center-workspace, .workspace, main, body") || document;
            const views = parentViewScope.querySelectorAll(".view-panel, .tab-content, .panel-view, .view-section, section[id], div[id^=\"view-\"], div[id^=\"tab-\"]");
            views.forEach(view => {
              const isTarget = view.id === targetId || view.id === "view-" + targetId || view.id === "tab-" + targetId || view.getAttribute("data-panel") === targetId || view.getAttribute("data-view") === targetId;
              if (isTarget) {
                view.style.display = "flex";
                view.classList.add("active");
              } else if (view.classList.contains("view-panel") || view.classList.contains("tab-content") || view.classList.contains("panel-view") || view.classList.contains("view-section")) {
                view.style.display = "none";
                view.classList.remove("active");
              }
            });
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindControls);
      } else {
        bindControls();
      }
    })();
  </script>
